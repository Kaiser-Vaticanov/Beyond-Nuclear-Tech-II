    # Fractional values are allowed (e.g. 0.25). Must be between 0 and shock_module_max_knockback_strength.
    # Example: 0.25 with 8 modules gives a total strength of 2.0. [range: 0.0 ~ 10.0, default: 0.5]
    S:shock_module_knockback_strength=0.5

    # Upper bound for shock_module_knockback_strength. Raise this to allow stronger knockback values.
