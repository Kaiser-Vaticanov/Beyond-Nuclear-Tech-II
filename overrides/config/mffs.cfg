}


projector {
    # Base number of blocks the projector places per tick before speed modules are counted. Example: 7 places 7 blocks/tick with no modules. [range: 1 ~ 2147483647, default: 7]
    I:baseProjectionSpeed=7

    # Divides the speed-module count when computing the removal drain rate. Formula: baseProjectionSpeed + speedModuleFactor * (speedModules / drainSpeedFactor). Higher values slow down removal per speed module. [range: 1 ~ 2147483647, default: 2]
    I:drainSpeedFactor=2

    # When true, the projector sweeps its full calculated field each projection cycle and fills gaps immediately (e.g. terrain dug out under the field). Useful in PvP scenarios. Disable on servers with large fields to reduce per-tick overhead. [default: false]
    B:enableFastFill=false

    # Initial Fortron tank capacity in F. [range: 1 ~ 2147483647, default: 500000]
    I:initialTankCapacity=500000

    # Maximum scale factor for the custom Force Field shape mode. Example: 200 allows the custom field to span up to 200 blocks. [range: 0 ~ 2147483647, default: 200]
    I:maxCustomModeScale=200

    # Maximum total number of Speed Modules insertable into a Force Field Projector. Example: 64 permits a full stack across the upgrade slots. [range: 0 ~ 2147483647, default: 64]
    I:maxSpeedModulesProjector=64

    # How often (in ticks) the main async projection cycle runs (calculate + select + project).
    # Example: 10 runs the cycle every 0.5 s; 20 runs it once per second.
    # It's advised to change projection speed and speed module factor first for best performance. [range: 1 ~ 100, default: 1]
    I:projectionCycleTicks=1

    # Blocks added to projection speed per Speed Module per tick.
    # Formula: baseProjectionSpeed + speedModuleFactor * speedModules.
    # Example: with baseProjectionSpeed=7 and speedModuleFactor=1, four modules gives 11 blocks/tick. [range: 1 ~ 2147483647, default: 1]
    I:speedModuleFactor=1

    # Fortron tank capacity added per Capacity Module in F. [range: 0 ~ 2147483647, default: 50000]
    I:tankCapacityPerModule=50000
}


