    I:shock_module_max_slot_count=64

    # Enable Silence Module [default: true]
    B:silence_module=true

    # Fortron cost per second (F/s) for Silence Module [range: 0.0 ~ 10000.0, default: 20.0]
    S:silence_module_fortron_cost=20.0

    # Enable Speed Module [default: true]
    B:speed_module=true

    # Fortron cost per second (F/s) for Speed Module [range: 0.0 ~ 10000.0, default: 20.0]
    S:speed_module_fortron_cost=20.0

    # Enable Sponge Module [default: true]
    B:sponge_module=true

    # Fortron cost per second (F/s) for Sponge Module [range: 0.0 ~ 10000.0, default: 20.0]
    S:sponge_module_fortron_cost=20.0

    # Enable Stabilization Module [default: true]
    B:stabilization_module=true

    # Fortron cost per second (F/s) for Stabilization Module [range: 0.0 ~ 10000.0, default: 400.0]
    S:stabilization_module_fortron_cost=400.0

    # Enable Translation Module [default: true]
    B:translation_module=true

    # Fortron cost per second (F/s) for Translation Module [range: 0.0 ~ 10000.0, default: 32.0]
    S:translation_module_fortron_cost=32.0

    # Enable Warn Module [default: true]
    B:warn_module=true

    # Fortron cost per second (F/s) for Warn Module [range: -10000.0 ~ 10000.0, default: -2.0]
