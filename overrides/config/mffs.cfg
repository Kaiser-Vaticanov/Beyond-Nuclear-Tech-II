# Configuration file

_client {
    # If enabled and CodeChickenLib is installed, render an emissive blue-accent overlay on machine blocks when active. [default: true]
    B:enableCodeChickenLibEmissiveBlocks=true

    # Apply a fancy glitch effect on projector mode renders. Reload resources to apply change. [default: true]
    B:enableProjectorModeGlitch=true

    # How many deferred world.checkLight() calls to process per client tick when the Glow Module is active.
    # Lower = less lighting stutter; too low may cause dark patches. [range: 1 ~ 2147483647, default: 60]
    I:glowLightChecksPerTick=60
}


_general {
    # Allow server operators to bypass Force Field biometry [default: true]
    B:allowOpBiometryOverride=true

    # Disable Steel Ingot and Steel Compound item registration. Other mods likely provide these items, causing conflicts. [default: true]
    B:disableSteelItems=true

    # Turning this to false will make MFFS run without electricity or energy systems required. Great for vanilla! [default: true]
    B:enableElectricity=true

    # Give players a copy of the MFFS guidebook when they first join a world [default: false]
    B:giveGuidebookOnFirstJoin=false

    # Should the interdiction matrix interact with creative players? [default: true]
    B:interactCreative=true

    # Cache allows temporary data saving to decrease calculations required [default: true]
    B:useCache=true
}


coercion_deriver {
    # Catalyst items for the Coercion Deriver.
    # Format: itemNamespace:itemPath:meta:burnTicks:multiplier
    #   meta       = item metadata value (0 for most items; lapis lazuli is dye meta 4 so minecraft:dye:4)
    #   burnTicks  = how long one item burns (in ticks)
    #   multiplier = additional Fortron output fraction while burning (e.g. 0.5 = +50%)
    # Examples: Nether Quartz (200t, +100%), Redstone (200t, +50%), Lapis Lazuli (400t, +50%) [default: [minecraft:quartz:0:200:1.0], [minecraft:redstone:0:200:0.5], [minecraft:dye:4:400:0.5]]
    S:catalysts <
        minecraft:quartz:0:200:1.0
        minecraft:redstone:0:200:0.5
        minecraft:dye:4:400:0.5
     >

    # FE to convert into 1 Fortron [range: 1 ~ 2147483647, default: 400]
    I:feCostPerFortron=400

    # Percentage discount applied to the FE cost per Fortron for each installed Speed Module (0–100).
    # Example: a value of 5 means each module reduces FE cost by 5% (4 modules = 20% cheaper). [range: 0 ~ 100, default: 1]
    I:fePerFortronSpeedDiscount=1

    # Base Fortron production rate (F/s). Scales with speed modules and catalyst. [range: 1 ~ 2147483647, default: 1000]
    I:fortronPerSecond=1000

    # Production bonus per speed module (F/s). [range: 1 ~ 2147483647, default: 500]
    I:fortronPerSecondSpeedModule=500

    # FE to subtract when converting Fortron to FE [range: 0 ~ 2147483647, default: 1]
    I:fortronToFeLoss=1

    # Initial Fortron tank capacity in F. [range: 1 ~ 2147483647, default: 30000]
    I:initialTankCapacity=30000

    # Fortron tank capacity added per Capacity Module in F. [range: 0 ~ 2147483647, default: 5000]
    I:tankCapacityPerModule=5000
}


force_field {
    # Allow authorized players to walk through force fields without sneaking. WARNING: May cause occasional clipping issues on horizontal platforms. [default: false]
    B:allowWalkThroughForceFields=false

    # Remove confusion and slowness effects for authorized players passing through force fields [default: false]
    B:disableForceFieldEffectsForAuthorizedPlayers=false

    # Controls spacing for force field light sources. 1 = every block emits, 3 = ~1/3 of blocks. [range: 1 ~ 2147483647, default: 3]
    I:forceFieldLightSpacing=3

    # When enabled, real light sources are only placed on force field blocks that touch physical blocks.
    # The remaining blocks use luminosity to create an illusion of lighting, reducing light-source count.
    # Example: a large flat field only lights its ground edge rather than every block in the field. [default: true]
    B:simpleLighting=true
}


fortron_capacitor {
    # Initial transmission range in blocks. [range: 1 ~ 2147483647, default: 15]
    I:initialRange=15

    # Initial Fortron tank capacity in F. [range: 1 ~ 2147483647, default: 700000]
    I:initialTankCapacity=700000

    # Base Fortron transmission rate in F/s. Example: 500 distributes up to 500 F per second across the network. [range: 1 ~ 2147483647, default: 500]
    I:initialTransmissionRate=500

    # Additional transmission range per Scale Module in blocks. [range: 0 ~ 2147483647, default: 1]
    I:rangePerModule=1

    # Fortron tank capacity added per Capacity Module in F. [range: 0 ~ 2147483647, default: 10000]
    I:tankCapacityPerModule=10000

    # Additional Fortron transmission rate per Speed Module in F/s. Example: 100 means four Speed Modules add 400 F/s to the base rate. [range: 0 ~ 2147483647, default: 100]
    I:transmissionRatePerModule=100
}


interdiction_matrix {
    # How often (in ticks) the Interdiction Matrix runs zone actions such as confiscation and damage.
    # Lower = more responsive but higher server load. Example: 10 fires every 0.5 s; 20 fires every 1 s. [range: 1 ~ 200, default: 20]
    I:actionTickRate=20

    # Initial Fortron tank capacity in F. [range: 1 ~ 2147483647, default: 500000]
    I:initialTankCapacity=500000

    # Fortron to consume when the Interdiction Matrix kills a player [range: 0 ~ 2147483647, default: 0]
    I:interdictionMatrixKillEnergy=0

    # Fortron to consume when the Interdiction Matrix kills a mob (hostile or friendly). Example: 100 costs 100 F per kill. [range: 0 ~ 2147483647, default: 0]
    I:interdictionMatrixMobKillEnergy=0

    # Maximum total number of Warn Modules insertable into an Interdiction Matrix. Example: 64 permits a full stack across the upgrade slots. [range: 0 ~ 2147483647, default: 64]
    I:maxWarnModulesIM=64

    # Minimum warning zone buffer in blocks beyond the action range, applied even with no Warn Modules installed.
    # Example: 6 extends the warn boundary 6 blocks past the action zone. [range: 0 ~ 2147483647, default: 6]
    I:minWarnRange=6

    # Controls what happens to mob drops when the Interdiction Matrix kills a mob.
    # NORMAL = drops as normal, no collection feature.
    # COLLECTION_OPTIONAL = mob drops normally, but Collection Module routes drops to an adjacent chest (overflow voided).
    # COLLECTION_REQUIRED = no drops unless a Collection Module is installed (overflow voided).
    # DISABLED = no drops at all. [default: COLLECTION_REQUIRED]
    S:mobDropMode=COLLECTION_REQUIRED

    # Fortron tank capacity added per Capacity Module in F. [range: 0 ~ 2147483647, default: 5000]
    I:tankCapacityPerModule=5000
}


modules {
    # Damage per second dealt to passive mobs (half-hearts). Applied each action tick proportional to actionTickRate.
    # Example: 0.5 gives gradual attrition; >5.0 clears the area rapidly and may unbalance nearby passive-mob farms. [range: 0.0 ~ 10000.0, default: 0.5]
    S:anti_friendly_damage_per_second=0.5

    # Enable Anti-Friendly Module [default: true]
    B:anti_friendly_module=true

    # Fortron cost per second (F/s) for Anti-Friendly Module [range: 0.0 ~ 10000.0, default: 10.0]
    S:anti_friendly_module_fortron_cost=10.0

    # Maximum number of Anti-Friendly Modules insertable across all Interdiction Matrix upgrade slots combined (1–64). [range: 1 ~ 64, default: 64]
    I:anti_friendly_module_max_slot_count=64

    # Damage per second dealt to hostile mobs (half-hearts). Applied each action tick proportional to actionTickRate.
    # Example: 0.5 provides slow attrition; >5.0 creates a near-instant kill zone around the matrix. [range: 0.0 ~ 10000.0, default: 0.5]
    S:anti_hostile_damage_per_second=0.5

    # Enable Anti-Hostile Module [default: true]
    B:anti_hostile_module=true

    # Fortron cost per second (F/s) for Anti-Hostile Module [range: 0.0 ~ 10000.0, default: 10.0]
    S:anti_hostile_module_fortron_cost=10.0

    # Maximum number of Anti-Hostile Modules insertable across all Interdiction Matrix upgrade slots combined (1–64). [range: 1 ~ 64, default: 64]
    I:anti_hostile_module_max_slot_count=64

    # Damage per second dealt to non-authorized players (half-hearts). Applied each action tick proportional to actionTickRate.
    # Example: 0.5 kills an unarmoured player in ~20 s; 2.0 in ~5 s. Values >100 restore near-instakill behaviour. [range: 0.0 ~ 10000.0, default: 0.5]
    S:anti_personnel_damage_per_second=0.5

    # Enable Anti-Personnel Module [default: true]
    B:anti_personnel_module=true

    # Fortron cost per second (F/s) for Anti-Personnel Module [range: 0.0 ~ 10000.0, default: 10.0]
    S:anti_personnel_module_fortron_cost=10.0

    # Maximum number of Anti-Personnel Modules insertable across all Interdiction Matrix upgrade slots combined (1–64). [range: 1 ~ 64, default: 64]
    I:anti_personnel_module_max_slot_count=64

    # Enable Anti-Spawn Module [default: true]
    B:anti_spawn_module=true

    # Fortron cost per second (F/s) for Anti-Spawn Module [range: 0.0 ~ 10000.0, default: 200.0]
    S:anti_spawn_module_fortron_cost=200.0

    # Enable Block Access Module [default: true]
    B:block_access_module=true

    # Fortron cost per second (F/s) for Block Access Module [range: 0.0 ~ 10000.0, default: 200.0]
    S:block_access_module_fortron_cost=200.0

    # Enable Block Alter Module [default: true]
    B:block_alter_module=true

    # Fortron cost per second (F/s) for Block Alter Module [range: 0.0 ~ 10000.0, default: 300.0]
    S:block_alter_module_fortron_cost=300.0

    # Enable Camouflage Module [default: true]
    B:camouflage_module=true

    # Fortron cost per second (F/s) for Camouflage Module [range: 0.0 ~ 10000.0, default: 30.0]
    S:camouflage_module_fortron_cost=30.0

    # Enable Capacity Module [default: true]
    B:capacity_module=true

    # Fortron cost per second (F/s) for Capacity Module [range: 0.0 ~ 10000.0, default: 10.0]
    S:capacity_module_fortron_cost=10.0

    # Enable Collection Module [default: true]
    B:collection_module=true

    # Fortron cost per second (F/s) for Collection Module [range: 0.0 ~ 10000.0, default: 300.0]
    S:collection_module_fortron_cost=300.0

    # Enable Confiscation Module [default: true]
    B:confiscation_module=true

    # Fortron cost per second (F/s) for Confiscation Module [range: 0.0 ~ 10000.0, default: 10.0]
    S:confiscation_module_fortron_cost=10.0

    # Enable Disintegration Module [default: true]
    B:disintegration_module=true

    # Fortron cost per second (F/s) for Disintegration Module [range: 0.0 ~ 10000.0, default: 400.0]
    S:disintegration_module_fortron_cost=400.0

    # Enable Dome Module [default: true]
    B:dome_module=true

    # Fortron cost per second (F/s) for Dome Module [range: 0.0 ~ 10000.0, default: 10.0]
    S:dome_module_fortron_cost=10.0

    # Enable Fusion Module [default: true]
    B:fusion_module=true

    # Fortron cost per second (F/s) for Fusion Module [range: 0.0 ~ 10000.0, default: 20.0]
    S:fusion_module_fortron_cost=20.0

    # Enable Glow Module [default: true]
    B:glow_module=true

    # Fortron cost per second (F/s) for Glow Module [range: 0.0 ~ 10000.0, default: 10.0]
    S:glow_module_fortron_cost=10.0

    # Enable Inverter Module [default: true]
    B:inverter_module=true

    # Fortron cost per second (F/s) for Inverter Module [range: 0.0 ~ 10000.0, default: 300.0]
    S:inverter_module_fortron_cost=300.0

    # Enable Rotation Module [default: true]
    B:rotation_module=true

    # Fortron cost per second (F/s) for Rotation Module [range: 0.0 ~ 10000.0, default: 2.0]
    S:rotation_module_fortron_cost=2.0

    # Enable Scale Module [default: true]
    B:scale_module=true

    # Fortron cost per second (F/s) for Scale Module [range: 0.0 ~ 10000.0, default: 24.0]
    S:scale_module_fortron_cost=24.0

    # Enable Shock Module [default: true]
    B:shock_module=true

    # Damage dealt per Shock Module per collision (half-hearts). Fractional values allowed.
    # Example: 0.25 means 4 modules deal 1 half-heart; set to 0 for knockback-only. [range: 0.0 ~ 1000.0, default: 0.25]
    S:shock_module_damage_per_module=0.25

    # When true, apply a knockback impulse on contact in addition to (or instead of) damage.
    # Example: true with shock_module_damage_per_module > 0 deals both damage and pushes the entity away. [default: true]
    B:shock_module_do_knockback=true

    # When true (and shock_module_do_knockback is also true), the knockback becomes a near-vertical launch (~85 degrees).
    # The entity is sent almost straight up with only a tiny outward nudge. Pure chaos. Default: false. [default: false]
    B:shock_module_do_space=false

    # Fortron cost per second (F/s) for Shock Module [range: 0.0 ~ 10000.0, default: 20.0]
    S:shock_module_fortron_cost=20.0

