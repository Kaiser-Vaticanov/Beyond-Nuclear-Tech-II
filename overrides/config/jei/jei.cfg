# Configuration file

~CONFIG_VERSION: 0.4.0

##########################################################################################################
# advanced
#--------------------------------------------------------------------------------------------------------#
# Расширенные параметры настройки работы HEI.
##########################################################################################################

advanced {
    # Если включено, новые закладки добавляются в самое начало списка. [default: false]
    B:addBookmarksToFront=true

    # Строит деревья поиска параллельно в нескольких потоках. Отключите при чрезмерной нагрузке на процессор во время загрузки HEI. [default: true]
    B:asyncSearchTreeBuilding=true

    # Переместить строку поиска HEI в центр нижней части экрана. [default: false]
    B:centerSearchBarEnabled=false
    B:debugModeEnabled=false

    # Способ выдачи предметов: напрямую в инвентарь (inventory) или взятие курсором мыши (mouse_pickup).
    # [По умолчанию: mouse_pickup]
    # [Доступно: [inventory, mouse_pickup]]
    S:giveMode=MOUSE_PICKUP

    # Hide the ingredient list until a search is entered. The search field remains available. [default: false]
    B:hideIngredientsWhenNotSearching=false

    # Максимальная ширина списка предметов (в колонках). [range: 2 ~ 100, default: 100]
    I:maxColumns=9

    # Максимальная высота окна рецепта. [range: 175 ~ 5000, default: 350]
    I:maxRecipeGuiHeight=350

    # Форматирование названия мода во всплывающих подсказках HEI. Оставьте пустым для отключения. [По умолчанию: blue italic] [Доступно: [black, dark_blue, dark_green, dark_aqua, dark_red, dark_purple, gold, gray, dark_gray, blue, green, aqua, red, light_purple, yellow, white, obfuscated, bold, strikethrough, underline, italic]]
    S:modNameFormat=blue italic
    B:optimizeMemoryUsage=true

    # Цвет группы закладок рецептов в формате RGBA. [range: -2147483648 ~ 2147483647, default: -1627324672]
    I:recipeBookmarkGroupColor=-1627324672

    # Включить режим ультра-низкого потребления памяти (может существенно замедлить поиск). [default: false]
    B:ultraLowMemoryUsage=false
}


category {
    # Определяет очередность вкладок категорий в HEI. Категории из начала списка отображаются первыми. [По умолчанию: []]
    S:categoryUidOrder <
     >

    # UID категорий рецептов, которые HEI не должен загружать. После изменения требуется перезапуск игры. [По умолчанию: []]
    S:disabledRecipeCategoryUids <
     >
}


##########################################################################################################
# collapsible
#--------------------------------------------------------------------------------------------------------#
# Параметры объединения групп предметов в один слот списка.
##########################################################################################################

collapsible {
    # Если включено, схожие предметы (зелья, зачарованные книги и т.д.) сворачиваются в один слот. Alt+ЛКМ по группе сворачивает или разворачивает ее.
    B:collapsibleGroupsEnabled=true

    # Автоматически сворачивать открытые группы при закрытии интерфейса HEI.
    B:collapseOnClose=false

    # Swaps the single click action. Open Group opens the group, and Alt+Click applies the action to the first item. First Item applies the action to the first item, and Alt+Middle Click opens the group.
    # [По умолчанию: open_group]
    # [Доступно: [open_group, first_item]]
    S:collapsedClickAction=OPEN_GROUP
    S:disabledGroups <
     >
}


##########################################################################################################
# misc
#--------------------------------------------------------------------------------------------------------#
# Различные вспомогательные настройки
##########################################################################################################

misc {
    # Where to place the config button. Left, Right, or Hidden.
    # [По умолчанию: right]
    # [Доступно: [left, right, hidden]]
    S:configButtonPosition=RIGHT

    # Скрывать ли кнопку закладок в левом нижнем углу экрана. [default: false]
    B:hideBottomLeftCornerBookmarkButton=false

    # Keep ingredients that only differ by NBT as separate history entries. [default: true]
    B:historyMatchNbt=true

    # Where to show the ingredients you last looked up. Left is under the bookmarks, Right is under the ingredient list, or Hidden.
    # [По умолчанию: right]
    # [Доступно: [left, right, hidden]]
    S:historyPosition=RIGHT

    # How many rows the history takes from the bottom of its list. [range: 1 ~ 6, default: 2]
    I:historyRows=2

    # Если включено, удерживайте кнопку мыши во время переноса и отпустите для сброса. Если отключено: один клик берет предмет, повторный — сбрасывает. [default: false]
    B:holdToDragGhostIngredients=false

    # Отключите, чтобы запретить клики мыши для открытия рецептов и применений при наведении на предмет. [default: true]
    B:mouseClickToSeeRecipes=true

    # При наведении на слот рецепта, принимающий несколько вариантов предметов, отображает их сеткой в подсказке. [default: true]
    B:recipeIngredientPreviewEnabled=true

    # Отображать скрытые пользователем предметы, если игрок находится в творческом режиме. [default: false]
    B:showHiddenIngredientsInCreative=false

    # Отключает отображение полос прогресса HEI при загрузке (может сэкономить несколько секунд). [default: false]
    B:skipShowingProgressBar=false

    # Показывать отметку об изменении рецепта во всплывающей подсказке предмета. [default: true]
    B:tooltipShowRecipeBy=true
}


rendering {
    # Предотвращает частые вызовы отрисовки через буфер рендера, увеличивая FPS в меню в 2-3 раза (анимации и свечение зачарований могут отображаться некорректно). [default: false]
    B:bufferIngredientRenders=false
}


##########################################################################################################
# search
#--------------------------------------------------------------------------------------------------------#
# Параметры строки поиска.
##########################################################################################################

search {
    # Режим поиска по цвету (префикс: ^)
    # [По умолчанию: disabled]
    # [Доступно: [enabled, require_prefix, disabled]]
    S:colorSearchMode=DISABLED

    # Режим поиска по названию творческой вкладки (префикс: %)
    # [По умолчанию: disabled]
    # [Доступно: [enabled, require_prefix, disabled]]
    S:creativeTabSearchMode=DISABLED

    # Режим поиска по имени мода (префикс: @)
    # [По умолчанию: require_prefix]
    # [Доступно: [enabled, require_prefix, disabled]]
    S:modNameSearchMode=require_prefix

    # Режим поиска по Ore Dictionary (префикс: $)
    # [По умолчанию: disabled]
    # [Доступно: [enabled, require_prefix, disabled]]
    S:oreDictSearchMode=DISABLED

    # Режим поиска по идентификатору ресурса (префикс: &)
    # [По умолчанию: disabled]
    # [Доступно: [enabled, require_prefix, disabled]]
    S:resourceIdSearchMode=DISABLED

    # Включает поиск по содержимому расширенных всплывающих подсказок [ПЕРЕЗАГРУЗИТ ДЕРЕВО ПОИСКА] [default: false]
    B:searchAdvancedTooltips=true

    # Включает в деревья поиска версию строк без диакритических знаков [ПЕРЕЗАГРУЗИТ ДЕРЕВО ПОИСКА] [default: false]
    B:searchStrippedDiacritics=false

    # Режим поиска по всплывающей подсказке (префикс: #)
    # [По умолчанию: enabled]
    # [Доступно: [enabled, require_prefix, disabled]]
    S:tooltipSearchMode=enabled
}


